<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Spotify-like Green Circle Background -->
  <circle cx="50" cy="50" r="50" fill="#1DB954"/>
  
  <!-- Content: White Lines representing "Music to Text" -->
  <!-- Top Line (Text) -->
  <rect x="25" y="32" width="50" height="8" rx="4" fill="white"/>
  
  <!-- Middle Line (Sound Wave) -->
  <path d="M25 50C25 50 30 42 35 50C40 58 45 42 50 50C55 58 60 42 65 50C70 58 75 50 75 50" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom Line (Translated Text) -->
